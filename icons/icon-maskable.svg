<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Solid background for maskable -->
  <rect width="512" height="512" fill="#0d1117"/>
  <!-- Centered hexagon (within safe zone - 80% of canvas) -->
  <polygon points="256,66 408,154 408,358 256,446 104,358 104,154" fill="none" stroke="url(#grad)" stroke-width="10"/>
  <!-- Terminal/monitor -->
  <rect x="176" y="195" width="160" height="122" rx="10" fill="none" stroke="url(#grad)" stroke-width="10"/>
  <!-- Cursor -->
  <text x="256" y="270" text-anchor="middle" font-family="monospace" font-size="56" font-weight="bold" fill="url(#grad)">_</text>
  <!-- Circuit dots -->
  <circle cx="256" cy="110" r="12" fill="url(#grad)"/>
  <circle cx="256" cy="402" r="12" fill="url(#grad)"/>
</svg>
