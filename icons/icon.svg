<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background hexagon -->
  <polygon points="256,20 472,140 472,372 256,492 40,372 40,140" fill="#0d1117"/>
  <polygon points="256,20 472,140 472,372 256,492 40,372 40,140" fill="none" stroke="url(#grad)" stroke-width="12"/>
  <!-- Terminal/monitor -->
  <rect x="156" y="180" width="200" height="152" rx="12" fill="none" stroke="url(#grad)" stroke-width="12"/>
  <!-- Cursor -->
  <text x="256" y="275" text-anchor="middle" font-family="monospace" font-size="72" font-weight="bold" fill="url(#grad)">_</text>
  <!-- Circuit dots -->
  <circle cx="256" cy="80" r="16" fill="url(#grad)"/>
  <circle cx="256" cy="432" r="16" fill="url(#grad)"/>
  <!-- Binary decorations -->
  <text x="100" y="260" font-family="monospace" font-size="24" fill="url(#grad)" opacity="0.5">01</text>
  <text x="388" y="260" font-family="monospace" font-size="24" fill="url(#grad)" opacity="0.5">10</text>
</svg>
